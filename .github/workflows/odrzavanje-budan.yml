name: Održavanje backenda budnim

# Besplatni Render zaspi nakon 15 minuta bez prometa, a buđenje traje oko minute.
# Klijent koji otvori link galerije ne smije čekati minutu, pa ga ovdje budimo svakih 10 minuta.
# (GitHub ne garantira točan sat; ako želiš 100% pouzdanost, najam Render "Starter" je oko 7 $ mjesečno.)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pozovi /health
        run: |
          curl -fsS --max-time 90 --retry 2 --retry-delay 10 "https://garmin-health-sync-xlyl.onrender.com/health"
