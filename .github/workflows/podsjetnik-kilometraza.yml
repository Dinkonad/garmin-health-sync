name: Podsjetnik za kilometražu

on:
  schedule:
    # 18:00 po srednjoeuropskom (ljetnom) vremenu ~= 16:00 UTC
    - cron: '0 16 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pozovi backend endpoint
        run: |
          curl -sf -X GET "https://garmin-health-sync-xlyl.onrender.com/push/provjeri-kilometrazu" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
